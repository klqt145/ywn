<!DOCTYPE html>
<html>
<head>
    <title>Google</title>
    <link rel="stylesheet" href="style9.css">
</head>

<body>
    <div class="navbar">
        <h1 class="logo-nav">AF</h1>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="index7.html">Register</a>
            <a href="index6.html">Login</a>
            <a href="index2.html">Google Account</a>
        </nav>
    </div>

    <main class="page">
        <form>
            <div class="left">
                <img class="logo" src="logo.png">
                <p class="info">Basic information</p>
                <p class="enter">Enter your birthday and gender</p>
            </div>

            <div class="right">
                <div class="date-group">
                    <input type="text" class="day" placeholder="Day">
                    <select class="month">
                        <option value="" disabled selected hidden>Month</option>
                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>
                    </select>
                    <input type="text" class="year" placeholder="Year">
                </div>

                <select class="gender">
                    <option value="" disabled selected hidden>Gender</option>
                    <option>Female</option>
                    <option>Male</option>
                    <option>Prefer not to say</option>
                </select>

                <div class="button-container">
                    <button type="button"><a href="index2.html">Next</a></button>
                </div>
            </div>
        </form>

        <footer class="footer">
            <p class="language">English (United States)</p>
            <nav class="footer-links">
                <a href="#">Help</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
            </nav>
        </footer>
    </main>
</body>
</html>
